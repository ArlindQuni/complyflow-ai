name: Import Lovable source production

on:
  push:
    paths:
      - ".github/workflows/import-source-production.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and commit source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/complyflow-import /tmp/source.zip
          mkdir -p /tmp/complyflow-import
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0" \
            "https://complyflow-copilot.lovable.app/complyflow-source.zip" \
            -o /tmp/source.zip
          unzip -q /tmp/source.zip -d /tmp/complyflow-import

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.source-transfer/' \
            /tmp/complyflow-import/ ./

          rm -rf .source-transfer
          rm -f docs/_export_*.json docs/_source_zip.b64
          rm -rf docs/_zipchunks docs/_zipchunks_small docs/_mirror
          rm -f public/complyflow-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full Lovable project source" || exit 0
          git push
