name: Import Lovable source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-lovable-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/complyflow-parts /tmp/complyflow-src
          for i in $(seq -w 1 61); do
            p=$(printf '%03d' "$((10#$i))")
            curl --fail --silent --show-error --location \
              "https://complyflow-copilot.lovable.app/transport4/source.part${p}.txt" \
              -o "/tmp/complyflow-parts/source.part${p}.txt"
          done
          cat /tmp/complyflow-parts/source.part*.txt > /tmp/complyflow-source.b64
          base64 --decode /tmp/complyflow-source.b64 > /tmp/complyflow-source.zip
          unzip -t /tmp/complyflow-source.zip
          unzip -q /tmp/complyflow-source.zip -d /tmp/complyflow-src

      - name: Mirror source into repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/complyflow-src/ ./ --exclude='.git/' --exclude='.github/'
          rm -rf .transport .transport4
          rm -f .github/workflows/import-source.yml

      - name: Verify expected project files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f bun.lock
          test -f src/routes/judge-demo.tsx
          test -f src/lib/analyze.functions.ts
          test -f src/lib/grounding.ts
          test -f docs/DEVPOST_SUBMISSION.md
          test -f docs/PITCH_DECK_CONTENT.md
          test -f README.md

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Mirror complete ComplyFlow AI source from Lovable'
            git push origin HEAD:main
          fi
